<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1</title>
    <style>
        *{margin: 0;padding: 0;}
        header {
            width: 100%;
            height: 40px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700;
            font-size: 20px;
        }

        header nav {
            width: 100%;
            height: 100%;
        }

        header nav ul {
            height: 100%;
            display: flex;
            border: 2px solid #786c6cdd;
        }

        header nav ul li {
            list-style: none;
            width: 25%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(to top, rgb(123, 113, 113), white);
        }
        header nav ul li:hover {
            background-image: linear-gradient(to top, rgba(15, 18, 103, 0.913), rgba(35, 41, 225, 0.807));
        }

        header nav ul li a {
            text-decoration: none;
            color: #000;
        }
        header nav ul li:hover a {
            color: #fff;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Lessons</a></li>
                <li><a href="#">Contacts</a></li>
                <li><a href="#">About us</a></li>
            </ul>
        </nav>
    </header>
</body>

</html>
